name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core-linux:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy -p ks-core --all-targets -- -D warnings
      - run: cargo test -p ks-core

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend (required by tauri::generate_context!)
        working-directory: app
        run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build installer
        working-directory: app
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyswitch-windows-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # Spike M-2a (AGENT 19): macOS integration probe against our own AppKit fixture.
  # Informational until M-2 closes; see docs/spikes/M-2a-mac-ax-probe.md.
  macos-probe:
    name: macOS probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Guard (D-27) - no event taps or input monitoring requests in the probe
        shell: bash
        run: |
          if grep -rnE 'tap_create|CGEventTapCreate|CGRequestListenEventAccess|request_listen|addGlobalMonitorForEvents|AXIsProcessTrustedWithOptions' crates/ks-probe-mac/src crates/ks-probe-mac/tests; then
            echo "forbidden API referenced"; exit 1
          fi
      - run: cargo clippy -p ks-probe-mac --all-targets -- -D warnings
      - run: cargo test -p ks-core
      - run: cargo test -p ks-probe-mac -- --nocapture --test-threads=1

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-deny --version 0.19.9 --locked
      - run: cargo deny --all-features check
      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=high
