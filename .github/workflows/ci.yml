name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core-linux:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy -p ks-core --all-targets -- -D warnings
      - run: cargo test -p ks-core

  guardrails:
    # WS-08 (S-2a security review): forbidden Win32 APIs / probe-only helpers must not appear
    # outside crates/ks-winprobe, and no crate may depend on ks-winprobe.
    name: Guardrails (forbidden APIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check-forbidden-apis.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend (required by tauri::generate_context!)
        working-directory: app
        run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build installer
        working-directory: app
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyswitch-windows-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  windows-probe:
    # Spikes S-2a/S-2b: Win32/UIA/SendInput/clipboard/layout/hotkey probe on the runner's
    # desktop; S-2b adds a separate fixture process, W2 delayed rendering, the W3 gate and
    # a Low-IL helper (integrity level lowered, never raised).
    # Reports are metadata-only KS-PROBE lines (no text content); they are also published
    # as one job annotation so results can be read without downloading logs.
    name: Windows integration probe (S-2a/S-2b)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      KS_WINPROBE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Probe tests
        shell: bash
        run: |
          set -o pipefail
          # --no-fail-fast: one failing scenario file must not hide the results of the others.
          cargo test -p ks-winprobe --no-fail-fast -- --nocapture --test-threads=1 2>&1 | tee probe.log
      # One notice per KS-PROBE line; split over two steps (GitHub keeps <= 10 per step).
      - name: Publish KS-PROBE lines (a-c)
        if: always()
        shell: bash
        run: |
          grep -o 'KS-PROBE {.*' probe.log | sed 's/\r$//' > probe-lines.txt || true
          { echo '## KS-PROBE'; echo '```'; cat probe-lines.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep '"test":"[abc]' probe-lines.txt | sed 's/%/%25/g; s/^/::notice title=KS-PROBE::/' || true
      - name: Publish KS-PROBE lines (d-f)
        if: always()
        shell: bash
        run: grep '"test":"[d-f]' probe-lines.txt | sed 's/%/%25/g; s/^/::notice title=KS-PROBE::/' || true
      - name: Publish KS-PROBE lines (g)
        if: always()
        shell: bash
        run: grep '"test":"g' probe-lines.txt | sed 's/%/%25/g; s/^/::notice title=KS-PROBE::/' || true
      - name: Publish KS-PROBE lines (h)
        if: always()
        shell: bash
        run: grep '"test":"h' probe-lines.txt | sed 's/%/%25/g; s/^/::notice title=KS-PROBE::/' || true
      - name: Publish KS-PROBE lines (i-z)
        if: always()
        shell: bash
        run: grep '"test":"[i-z]' probe-lines.txt | sed 's/%/%25/g; s/^/::notice title=KS-PROBE::/' || true

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-deny --version 0.19.9 --locked
      - run: cargo deny --all-features check
      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=high
