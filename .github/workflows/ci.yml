name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core-linux:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy -p ks-core --all-targets -- -D warnings
      - run: cargo test -p ks-core

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend (required by tauri::generate_context!)
        working-directory: app
        run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build installer
        working-directory: app
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyswitch-windows-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  sandbox:
    # Spike S-3a: Wasmtime layer of the macro sandbox (hostile WAT suite, protocol limits,
    # separate-process smoke test). OS isolation (LPAC/Job, App Sandbox) is S-3b/S-3c.
    name: Sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -p ks-sandbox-proto -p ks-sandbox --all-targets -- -D warnings
      - name: Protocol tests (incl. 100 000 deterministic random frames)
        run: cargo test -p ks-sandbox-proto
      - name: Protocol random frames, 1 000 000 (SR-46)
        run: cargo test -p ks-sandbox-proto random_inputs
        env:
          KS_PROTO_FUZZ_ITERS: "1000000"
      - name: Hostile Wasm suite + process smoke test
        run: cargo test -p ks-sandbox
      - name: Timing numbers (content-free; durations and outcome codes only)
        run: cargo test -p ks-sandbox --test hostile timing_numbers_for_report -- --nocapture
      - name: Timing numbers, release build
        run: cargo test --release -p ks-sandbox --test hostile timing_numbers_for_report -- --nocapture

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-deny --version 0.19.9 --locked
      - run: cargo deny --all-features check
      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=high
