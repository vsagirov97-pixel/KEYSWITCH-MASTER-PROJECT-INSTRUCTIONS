[package]
name = "ks-win-manual-probe"
description = "W-MAN-1: manual Windows test kit run by the owner on a real PC (metadata-only report). Not product code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "ks-win-manual-probe"
path = "src/main.rs"

# Like ks-winprobe, this crate does not inherit `[workspace.lints]` because Win32 needs FFI.
# Every `unsafe` block must carry a `// SAFETY:` comment; the other workspace lints are
# repeated verbatim (console output goes through `std::io::Write`, not print macros).
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

# `windows` 0.62.2 is already in Cargo.lock (Tauri, ks-winprobe); no new crate enters the
# graph, only the feature set below.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Controls_RichEdit",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
